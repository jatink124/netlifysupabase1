<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Netlify + MongoDB demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 700px; margin:auto; }
    input, button { padding:8px; font-size:16px; margin-right:8px; }
    ul { padding-left: 20px; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>Netlify → Function → MongoDB Atlas</h1>

  <form id="addForm">
    <input id="name" placeholder="Enter name" required />
    <button type="submit">Add</button>
    <button id="refresh" type="button">Refresh</button>
  </form>

  <div id="status" style="margin-top:10px;"></div>

  <h2>Saved users</h2>
  <ul id="list"></ul>

  <script>
    const FN_URL = '/.netlify/functions/mongo-proxy';
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('list');
    const form = document.getElementById('addForm');

    function setStatus(msg) { statusEl.textContent = msg; }

    async function fetchList() {
      setStatus('Loading...');
      listEl.innerHTML = '';
      try {
        const res = await fetch(FN_URL);
        if (!res.ok) throw new Error('Fetch failed: ' + res.statusText);
        const json = await res.json();
        const users = json.users || [];
        if (!users.length) {
          listEl.innerHTML = '<li><em>No users yet</em></li>';
        } else {
          listEl.innerHTML = users.map(u => {
            const d = new Date(u.createdAt);
            return `<li>${escapeHtml(u.name)} <small>(${d.toLocaleString()})</small></li>`;
          }).join('');
        }
        setStatus('Loaded ' + users.length + ' users');
      } catch (err) {
        setStatus('Error: ' + err.message);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      if (!name) return;
      setStatus('Saving...');
      try {
        const res = await fetch(FN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Unknown error');
        document.getElementById('name').value = '';
        setStatus('Saved ✓');
        fetchList();
      } catch (err) {
        setStatus('Error: ' + err.message);
      }
    });

    document.getElementById('refresh').addEventListener('click', fetchList);

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]);
    }

    // initial load
    fetchList();
  </script>
</body>
</html>
